# .github/workflows/ci.yml — gerbang mutu di tiap PR & push ke master
# Menjalankan: typecheck (tsc) → unit test (vitest) → build (next build, ESLint ikut di dalamnya).
# Env Supabase diambil dari GitHub Secrets bila ada; fallback placeholder agar build tetap
# bisa jalan tanpa secrets (query runtime tak dieksekusi saat build).
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (next build + ESLint)
        run: npm run build
