      <text x="600" y="700" text-anchor="middle" font-size="11" fill="#b06" font-style="italic">"Bayar Langganan" memicu "Aktifkan Langganan" oleh Owner (proses manual — Opsi B)</text>
      <text x="600" y="720" text-anchor="middle" font-size="11" fill="#999">Oval putus-putus = fitur Tahap 2 / 3 (didesain sekarang, dibangun menyusul)</text>
